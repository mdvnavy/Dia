  <script>
    // Same saved (or system) theme as the main page, before first paint.
    (function () {
      try {
        var saved = localStorage.getItem("dia-theme");
        document.documentElement.dataset.theme = saved || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
      } catch (error) { document.documentElement.dataset.theme = "dark"; }
    })();
  </script>

  <!-- What changed: the full list behind the header bell. Data: /static/changelog.json, built from git history by

    <nav class="changes-top" aria-label="Back to DIA">
      <a class="changes-back" href="/"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>Back to DIA</a>

    <p class="changes-lede">Changes to Dia, newest first.</p>
